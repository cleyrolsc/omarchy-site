name: Validate Astro site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Astro and validate Cloudflare packaging
        run: npm run check:cloudflare
      - run: npm run parity
      - run: npm run build:storybook
      - run: npx playwright install --with-deps chromium
      - name: Check redesign layouts, interactions, and Storybook
        run: npm run test:browser
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
